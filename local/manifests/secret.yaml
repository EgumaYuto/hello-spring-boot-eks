# Local-only dummy credentials (same values as docker-compose.yaml).
# In the EKS version these come from AWS Secrets Manager via deploy.sh; here they
# are static because this cluster only ever runs on your laptop.
apiVersion: v1
kind: Secret
metadata:
  name: db
  namespace: hello-spring-boot
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hellodb
  SPRING_DATASOURCE_USERNAME: hellouser
  SPRING_DATASOURCE_PASSWORD: hellopassword
