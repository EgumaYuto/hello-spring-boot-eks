# kind (Kubernetes IN Docker) cluster for local, zero-cost learning.
#
# The control-plane node is labeled "ingress-ready" and maps host ports 80/443
# into the node, so the nginx Ingress controller is reachable at http://localhost/.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hello-spring-boot
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
